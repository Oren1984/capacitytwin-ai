# Local demonstration only. The port is bound to localhost on purpose:
# the app has no authentication and is not meant to be exposed to a network.
services:
  capacitytwin:
    build: .
    image: capacitytwin-ai:local
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      CAPACITYTWIN_AI_MODE: ${CAPACITYTWIN_AI_MODE:-mock}
      CAPACITYTWIN_LOG_LEVEL: ${CAPACITYTWIN_LOG_LEVEL:-INFO}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
